<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#003C41">
  <title>BIOTROP — Gestão Industrial</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f2;font-family:Inter,Segoe UI,system-ui,-apple-system,sans-serif}
    #app{position:fixed;inset:0;display:flex;flex-direction:column;background:#eef5f2}
    .boot{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(145deg,#003c41,#005b56);transition:opacity .25s ease,visibility .25s ease}
    .boot.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .boot-card{width:min(410px,calc(100vw - 36px));padding:32px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(4,41,43,.68);box-shadow:0 24px 70px rgba(0,0,0,.23);color:#fff;text-align:center;backdrop-filter:blur(16px)}
    .boot-card img{width:76px;height:76px;display:block;margin:0 auto 18px;border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.2)}
    .boot-title{font-weight:800;font-size:20px;letter-spacing:-.02em}.boot-sub{margin-top:8px;color:#c9e5d9;font-size:13px}
    .boot-line{height:4px;margin-top:22px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}.boot-line i{display:block;width:38%;height:100%;background:#8be84f;border-radius:inherit;animation:load 1.1s ease-in-out infinite}
    @keyframes load{0%{transform:translateX(-130%)}100%{transform:translateX(320%)}}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f6faf8}
    .error{display:none;position:absolute;inset:0;z-index:30;place-items:center;padding:24px;background:#eef5f2}.error.show{display:grid}.error-card{max-width:520px;padding:28px;border-radius:20px;background:#fff;border:1px solid #dcebe4;box-shadow:0 24px 80px rgba(0,38,36,.12);text-align:center}.error-card h1{margin:0;color:#003c41;font-size:22px}.error-card p{color:#62766e;line-height:1.55;font-size:14px}.error-card button{border:0;border-radius:999px;background:#003c41;color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
<div id="app">
  <div id="boot" class="boot">
    <div class="boot-card">
      <img src="../assets/biotrop-logo.svg" alt="BIOTROP">
      <div class="boot-title">BIOTROP · Gestão Industrial</div>
      <div class="boot-sub">Carregando o ambiente operacional com os módulos existentes.</div>
      <div class="boot-line"><i></i></div>
    </div>
  </div>
  <iframe id="legacy-app" title="BIOTROP Gestão Industrial" src="../app.html" allow="camera;geolocation"></iframe>
  <div id="error" class="error">
    <div class="error-card">
      <h1>Não foi possível abrir o sistema</h1>
      <p>O ambiente principal não respondeu. A estrutura original continua preservada; tente recarregar para abrir novamente.</p>
      <button id="retry">Recarregar sistema</button>
    </div>
  </div>
</div>
<script src="./rebuild.js" defer></script>
</body>
</html>
