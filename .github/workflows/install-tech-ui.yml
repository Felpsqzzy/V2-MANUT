name: Install technician UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject technician UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="./assets/js/utility-tech-ui.js"></script>'
          anchor = '<script src="./assets/js/biotrop-production-v2.js"></script>'
          if marker not in s:
              if anchor not in s:
                  raise SystemExit('Anchor script not found in app.html')
              s = s.replace(anchor, anchor + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: carregar interface simples para tecnicos"
          git push
