name: Apply technician interface

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject UI patches
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')

          patches = [
              ('<script src="./assets/js/technician-simple-mode-v1.js"></script>',
               ['<script src="./assets/js/biotrop-production-v2.js"></script>',
                '<script src="./assets/js/biotrop-business-rules.js"></script>']),
              ('<script src="./assets/js/executive-home-v3.js?v=20260901"></script>',
               ['</body>'])
          ]

          # Interface técnica já existente.
          tech_marker = patches[0][0]
          if tech_marker not in s:
              for anchor in patches[0][1]:
                  if anchor in s:
                      s = s.replace(anchor, anchor + '\n' + tech_marker, 1)
                      print('Interface técnica injetada.')
                      break
              else:
                  print('Interface técnica: marcador/âncora não encontrado; mantendo arquivo.')
          else:
              print('Interface técnica já está carregada.')

          # Novo painel executivo para PCM/gestores/admins.
          exec_marker = patches[1][0]
          if exec_marker not in s:
              anchor = patches[1][1][0]
              if anchor not in s:
                  raise SystemExit('app.html sem </body> para injetar o dashboard executivo')
              s = s.replace(anchor, exec_marker + '\n' + anchor, 1)
              print('Dashboard executivo v3 injetado.')
          else:
              print('Dashboard executivo v3 já está carregado.')

          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git commit -m "feat: aplicar painel executivo e interface tecnica"
          git push
