name: Apply technician interface

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject UI patches
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')

          tech_marker = '<script src="./assets/js/technician-simple-mode-v1.js"></script>'
          tech_anchors = [
              '<script src="./assets/js/biotrop-production-v2.js"></script>',
              '<script src="./assets/js/biotrop-business-rules.js"></script>'
          ]
          if tech_marker not in s:
              for anchor in tech_anchors:
                  if anchor in s:
                      s = s.replace(anchor, anchor + '\n' + tech_marker, 1)
                      print('Interface técnica injetada.')
                      break
              else:
                  print('Interface técnica: âncora não encontrada; mantendo arquivo.')
          else:
              print('Interface técnica já está carregada.')

          exec_marker = '<script src="./assets/js/executive-home-v3.js?v=20260901"></script>'
          if exec_marker not in s:
              anchor = '</body>'
              if anchor in s:
                  s = s.replace(anchor, exec_marker + '\n' + anchor, 1)
                  print('Dashboard executivo v3 injetado.')

          live_marker = '<script src="./assets/js/executive-dashboard-live-v4.js?v=20260901-2"></script>'
          if live_marker not in s:
              anchor = '</body>'
              if anchor not in s:
                  raise SystemExit('app.html sem </body> para injetar o dashboard live v4')
              s = s.replace(anchor, live_marker + '\n' + anchor, 1)
              print('Dashboard executivo live v4 injetado.')
          else:
              print('Dashboard executivo live v4 já está carregado.')

          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git commit -m "feat: dashboard live por CAMM e fila de aprovacoes"
          git push
