name: Apply technician interface

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize application scripts
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')

          tech_marker = '<script src="./assets/js/technician-simple-mode-v1.js"></script>'
          tech_anchors = [
              '<script src="./assets/js/biotrop-production-v2.js"></script>',
              '<script src="./assets/js/biotrop-business-rules.js"></script>'
          ]
          s = s.replace(tech_marker, '')
          for anchor in tech_anchors:
              if anchor in s:
                  s = s.replace(anchor, anchor + '\n' + tech_marker, 1)
                  break

          # NUNCA reinserir o dashboard executivo. Ele estava causando a troca de telas.
          s = re.sub(r'\s*<script[^>]+executive-home-v3\.js[^>]*></script>', '', s)
          s = re.sub(r'\s*<script[^>]+executive-dashboard-live-v4\.js[^>]*></script>', '', s)
          s = re.sub(r'\s*<script[^>]+role-workspace-v2\.js[^>]*></script>', '', s)

          p.write_text(s, encoding='utf-8')
          print('Interface técnica preservada; loaders executivos removidos definitivamente.')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git commit -m "fix: impedir reinserção do dashboard executivo"
          git push
