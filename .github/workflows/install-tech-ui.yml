name: Apply technician interface

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize application scripts
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app.html')
          s = p.read_text(encoding='utf-8')

          # Mantém a interface simples do técnico uma única vez.
          tech_marker = '<script src="./assets/js/technician-simple-mode-v1.js"></script>'
          tech_anchors = [
              '<script src="./assets/js/biotrop-production-v2.js"></script>',
              '<script src="./assets/js/biotrop-business-rules.js"></script>'
          ]
          s = s.replace(tech_marker, '')
          for anchor in tech_anchors:
              if anchor in s:
                  s = s.replace(anchor, anchor + '\n' + tech_marker, 1)
                  break

          # O problema de alternância vinha de duas interfaces executivas montadas
          # ao mesmo tempo (v3 + live v4). Remove todas as versões antigas e deixa
          # exatamente uma versão live.
          s = re.sub(r'\s*<script[^>]+executive-home-v3\.js[^>]*></script>', '', s)
          s = re.sub(r'\s*<script[^>]+executive-dashboard-live-v4\.js[^>]*></script>', '', s)

          live = '<script src="./assets/js/executive-dashboard-live-v4.js?v=20260901-stable"></script>'
          if '</body>' not in s:
              raise SystemExit('app.html sem </body>')
          s = s.replace('</body>', live + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          print('Scripts normalizados: uma única visão executiva + uma única interface técnica.')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git commit -m "fix: manter uma única visão do dashboard"
          git push
