name: Prepare Express API for Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, 'chore(vercel): expose express api') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expose Express app as Vercel Function
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('server/index.ts')
          text = p.read_text(encoding='utf-8')

          old_decl = 'const app = express();'
          new_decl = 'export const app = express();'
          if old_decl in text:
              text = text.replace(old_decl, new_decl, 1)

          old_listen = "app.listen(port, () => {\n  console.log(`BIOTROP API ouvindo em http://localhost:${port}`);\n});"
          new_listen = "export default app;\n\nif (!process.env.VERCEL) {\n  app.listen(port, () => {\n    console.log(`BIOTROP API ouvindo em http://localhost:${port}`);\n  });\n}"
          if old_listen not in text:
              raise SystemExit('Expected server listen block not found; aborting.')
          text = text.replace(old_listen, new_listen, 1)
          p.write_text(text, encoding='utf-8')

          api = Path('api/[...path].ts')
          api.parent.mkdir(parents=True, exist_ok=True)
          api.write_text("import app from '../server/index';\n\nexport default app;\n", encoding='utf-8')
          PY

      - name: Commit Vercel API adapter
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts api/[...path].ts
          git diff --cached --quiet || git commit -m "chore(vercel): expose express api"
          git push
