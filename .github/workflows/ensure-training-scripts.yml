name: Ensure training scripts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-training-scripts:
    if: ${{ !contains(github.event.head_commit.message, 'fix: impedir workflow de reinserir dashboard executivo') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize application scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app.html')
          text = p.read_text(encoding='utf-8')

          # Nunca permitir que o dashboard executivo antigo volte.
          text = re.sub(r'\s*<script[^>]+executive-home-v3\.js[^>]*></script>', '', text)
          text = re.sub(r'\s*<script[^>]+executive-dashboard-live-v4\.js[^>]*></script>', '', text)
          text = re.sub(r'\s*<script[^>]+role-workspace-v2\.js[^>]*></script>', '', text)

          # Mantém os módulos de treinamento existentes, sem duplicação.
          required = [
              './assets/js/training-module-v2.js',
              './assets/js/training-module-v2-fix.js',
              './assets/js/training-runtime-fix-v3.js'
          ]
          anchor = '<script src="./assets/js/technician-simple-mode-v1.js"></script>'
          for src in required:
              text = re.sub(r'\s*<script[^>]+src=["\']'+re.escape(src)+r'["\'][^>]*></script>', '', text)
          if anchor not in text:
              raise SystemExit('Anchor técnico não encontrado em app.html')
          insert = anchor + '\n' + '\n'.join(f'<script src="{src}"></script>' for src in required)
          text = text.replace(anchor, insert, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit normalized app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: normalizar shell e preservar treinamentos'
          git push
