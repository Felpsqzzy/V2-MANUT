name: Disable executive dashboard
on: [push]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'cleanup: executive dashboard') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove executive dashboard loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          p.write_text('\n'.join(x for x in s.splitlines() if 'executive-dashboard-live-v4.js' not in x)+'\n',encoding='utf-8')
          PY
      - name: Remove dashboard autoloaders
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          p.write_text('\n'.join(x for x in s.splitlines() if not any(k in x for k in ('executive-dashboard-live-v4','ui-polish-v6','role-workspace-v2')))+'\n',encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/disable-executive-dashboard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html app.js .github/workflows/disable-executive-dashboard.yml
          git commit --allow-empty -m 'cleanup: executive dashboard'
          git push
