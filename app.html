<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biotrop - Plataforma de Manutenção</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background: #f4f7f6;
    min-height: 100vh;
  }
  #app { min-height: 100vh; width: 100%; }

  /* ============ LOGIN ============ */
  .login-wrap { display: flex; width: 100%; min-height: 100vh; }
  .login-left { flex: 1.75; background: #003C41; position: relative; overflow: hidden; min-width: 0; }
  .left-panel-img { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }

  .login-right { flex: 1; background: #fff; display: flex; align-items: center; justify-content: center; padding: 40px 24px; min-width: 0; }
  .right-inner { width: 100%; max-width: 380px; }

  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .logo-img-right { height: 40px; width: auto; display: block; }

  .welcome-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .welcome-icon { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #1a8f6b; color: #1a8f6b; display: flex; align-items: center; justify-content: center; }
  .welcome-title { font-size: 22px; font-weight: 800; color: #003C41; margin: 0; }
  .welcome-sub { font-size: 13.5px; color: #6b7a75; margin: 4px 0 24px 42px; }

  .field-label { font-size: 13px; font-weight: 600; color: #26463b; display: block; margin-bottom: 6px; }
  .input-wrap { display: flex; align-items: center; gap: 8px; border: 1.5px solid #d7e6df; border-radius: 10px; padding: 11px 14px; background: #fbfdfc; }
  .input-wrap:focus-within { border-color: #1a8f6b; }
  .input-wrap input { border: none; outline: none; background: transparent; flex: 1; font-size: 14px; color: #17332b; font-family: inherit; }
  .input-icon { color: #8fa89e; flex-shrink: 0; }
  .eye-btn { background: none; border: none; color: #8fa89e; cursor: pointer; padding: 2px; display: flex; }

  .login-error { background: #fdecec; color: #b3261e; font-size: 12.5px; padding: 9px 12px; border-radius: 8px; margin-top: 12px; }

  .row-between { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 20px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #33473f; cursor: pointer; }
  .checkbox-row input { accent-color: #1a8f6b; width: 15px; height: 15px; cursor: pointer; }
  .link-btn { background: none; border: none; color: #1a8f6b; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; }
  .link-btn:hover { text-decoration: underline; }

  .submit-btn { width: 100%; background: #003C41; color: #fff; border: none; border-radius: 999px; padding: 8px 20px 8px 8px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; font-family: inherit; }
  .submit-btn:hover { background: #002a2e; }
  .submit-btn-icon { width: 34px; height: 34px; border-radius: 50%; background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

  .hint-box { margin-top: 12px; background: #eef6f2; color: #26463b; font-size: 12.5px; padding: 10px 12px; border-radius: 8px; }

  .divider { display: flex; align-items: center; text-align: center; margin: 22px 0; color: #a9b8b2; font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #e5eeea; }
  .divider span { padding: 0 12px; }

  .secure-box { display: flex; gap: 10px; align-items: flex-start; background: #eef8f3; border-radius: 10px; padding: 13px 14px; margin-bottom: 20px; }
  .secure-title { font-size: 13.5px; font-weight: 700; color: #003C41; }
  .secure-sub { font-size: 12px; color: #5f7d72; margin-top: 2px; }

  .help-row { display: flex; gap: 10px; align-items: flex-start; }
  .help-title { font-size: 13.5px; font-weight: 700; color: #003C41; }
  .help-sub { font-size: 12px; color: #6b7a75; line-height: 1.5; margin-top: 2px; }

  .demo-note { margin-top: 22px; font-size: 11px; color: #9aa8a3; text-align: center; }

  /* ============ APP SHELL ============ */
  .shell { display: flex; width: 100%; min-height: 100vh; }
  .sidebar { width: 240px; background: linear-gradient(180deg, #003C41, #005058 60%, #003C41); color: #fff; display: flex; flex-direction: column; padding: 22px 16px; flex-shrink: 0; }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 22px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 18px; }
  .sidebar-logo-icon { height: 34px; width: auto; display: block; flex-shrink: 0; }
  .sb-name { font-weight: 800; font-size: 16px; }
  .sb-sub { font-size: 10.5px; color: #a9d9c4; }

  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 10px; background: none; border: none; color: #cfe9de; padding: 11px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; text-align: left; font-family: inherit; width: 100%; }
  .nav-item:hover { background: rgba(255,255,255,0.06); }
  .nav-item.active { background: #14563f; color: #fff; font-weight: 700; }
  .nav-item-sub { padding-left: 30px; font-size: 13px; color: #a9d9c4; }
  .nav-item-lvl1 { padding-left: 30px; font-size: 13.5px; }
  .nav-item-lvl2 { padding-left: 46px; font-size: 13px; color: #a9d9c4; }
  .nav-children { display: flex; flex-direction: column; gap: 2px; }
  .nav-chevron { margin-left: auto; display: flex; transition: transform 0.15s ease; transform: rotate(-90deg); flex-shrink: 0; }
  .nav-chevron.expanded { transform: rotate(0deg); }
  .nav-group span:not(.nav-chevron) { flex: 1; }

  .sidebar-footer { border-top: 1px solid rgba(255,255,255,0.12); padding-top: 14px; margin-top: 10px; }
  .user-chip { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 0 6px; }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #1a8f6b; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .user-name { font-size: 13px; font-weight: 700; }
  .user-role { font-size: 11px; color: #a9d9c4; }
  .logout-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.08); border: none; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; }
  .logout-btn:hover { background: rgba(255,255,255,0.15); }

  .mobile-menu-btn { display: none; }

  .main-area { flex: 1; padding: 32px 40px; overflow-y: auto; min-width: 0; }
  .storage-warning { background: #fff4e5; color: #8a5a00; font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; }

  .page-title-row { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
  .page-icon { width: 48px; height: 48px; border-radius: 12px; background: #e3eff0; color: #003C41; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .page-title-row h1 { font-size: 22px; font-weight: 800; color: #17332b; margin: 0 0 4px; }
  .page-title-row p { font-size: 13.5px; color: #6b7a75; margin: 0; }
  .page-title-row .primary-btn { margin-left: auto; }

  .empty-card { background: #fff; border: 1.5px dashed #d7e6df; border-radius: 16px; padding: 48px 24px; text-align: center; color: #4d635a; }
  .empty-icon { width: 56px; height: 56px; border-radius: 50%; background: #eef8f3; color: #1a8f6b; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
  .empty-title { font-weight: 700; font-size: 15px; color: #17332b; margin-bottom: 6px; }
  .empty-desc { font-size: 13.5px; max-width: 420px; margin: 0 auto; line-height: 1.6; }

  .primary-btn { display: flex; align-items: center; gap: 6px; background: #003C41; color: #fff; border: none; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .primary-btn:hover { background: #002a2e; }
  .ghost-btn { background: none; border: 1.5px solid #d7e6df; color: #33473f; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .danger-btn { display: flex; align-items: center; gap: 6px; background: #d64545; color: #fff; border: none; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; }

  .table-card { background: #fff; border-radius: 16px; border: 1px solid #e7f0ec; overflow: hidden; overflow-x: auto; }
  .users-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
  .users-table th { text-align: left; background: #f6faf8; color: #4d635a; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; padding: 12px 18px; border-bottom: 1px solid #e7f0ec; }
  .users-table td { padding: 13px 18px; border-bottom: 1px solid #f0f5f2; color: #17332b; }
  .users-table tr:last-child td { border-bottom: none; }

  .badge { background: #eef2f0; color: #4d635a; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .badge-admin { background: #e3eff0; color: #003C41; }

  .area-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: #eef8f3; color: #1a8f6b; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px; }
  .tag-empty { color: #b0bdb8; font-size: 12px; }

  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .icon-btn { background: #f4f7f6; border: none; color: #33473f; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn:hover { background: #e7f0ec; }
  .icon-btn.danger { color: #d64545; }
  .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(11,61,46,0.35); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 460px; padding: 24px; max-height: 90vh; overflow-y: auto; }
  .modal.small { max-width: 380px; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-header h3 { margin: 0; font-size: 17px; color: #17332b; }
  .modal-input { width: 100%; border: 1.5px solid #d7e6df; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; color: #17332b; outline: none; }
  .modal-input:focus { border-color: #1a8f6b; }
  .area-checks { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .confirm-text { font-size: 13.5px; color: #33473f; line-height: 1.6; }

  .home-menu { max-width: 980px; margin: 0 auto; padding-top: 24px; }
  .home-header { text-align: center; margin-bottom: 40px; }
  .home-header h1 { font-size: 28px; font-weight: 800; color: #17332b; margin: 0 0 8px; }
  .home-header p { font-size: 14.5px; color: #6b7a75; margin: 0; }
  .home-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
  .home-card { background: #fff; border: 1.5px solid #e7f0ec; border-radius: 18px; padding: 32px 26px; text-align: left; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; gap: 10px; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; width: 100%; }
  .home-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(11,61,46,0.10); border-color: #1a8f6b; }
  .home-card-icon { width: 52px; height: 52px; border-radius: 14px; background: #e3eff0; color: #003C41; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
  .home-card-title { font-size: 18px; font-weight: 800; color: #17332b; }
  .home-card-desc { font-size: 13.5px; color: #6b7a75; line-height: 1.5; flex: 1; }
  .home-card-arrow { font-size: 13px; font-weight: 700; color: #1a8f6b; margin-top: 6px; }
  .home-empty { grid-column: 1 / -1; background: #fff; border: 1.5px dashed #d7e6df; border-radius: 16px; padding: 40px 24px; text-align: center; color: #6b7a75; font-size: 14px; }

  .tabs-row { display: flex; gap: 8px; margin-bottom: 22px; border-bottom: 1.5px solid #e7f0ec; }
  .tab-btn { background: none; border: none; padding: 10px 16px; font-size: 13.5px; font-weight: 600; color: #6b7a75; cursor: pointer; font-family: inherit; border-bottom: 2.5px solid transparent; margin-bottom: -1.5px; }
  .tab-btn:hover { color: #17332b; }
  .tab-btn.active { color: #003C41; border-bottom-color: #1a8f6b; }

  .sci-card { background: #fff; border: 1px solid #e7f0ec; border-radius: 16px; padding: 28px; max-width: 640px; }
  .sci-section-title { font-size: 14px; font-weight: 800; color: #003C41; margin: 22px 0 6px; padding-top: 16px; border-top: 1px solid #f0f5f2; }
  .sci-photo-row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  textarea.modal-input { resize: vertical; font-family: inherit; }

  .fam-field-row { display: flex; align-items: center; gap: 10px; }
  .fam-field-row .fam-field-label { flex: 1; }
  .fam-field-row .fam-field-req { white-space: nowrap; }

  .sci-detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f0f5f2; font-size: 13.5px; }
  .sci-detail-label { color: #6b7a75; font-weight: 600; }
  .sci-detail-value { color: #17332b; text-align: right; }

  .scm-item-card { background: #fafcfb; border: 1px solid #e7f0ec; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .scm-item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }

  @media (max-width: 900px) {
    .login-left { display: none; }
    .login-right { flex: 1; }
  }
  @media (max-width: 768px) {
    .mobile-menu-btn { display: flex; position: fixed; top: 16px; left: 16px; z-index: 40; background: #003C41; color: #fff; border: none; width: 40px; height: 40px; border-radius: 10px; align-items: center; justify-content: center; cursor: pointer; }
    .sidebar { position: fixed; top: 0; left: 0; height: 100vh; z-index: 45; transform: translateX(-100%); transition: transform 0.2s ease; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 42; }
    .main-area { padding: 72px 18px 24px; }
  }

.register-access-btn{width:100%;margin-top:10px;border:1px solid #cfe0dd;background:transparent;color:#006257;border-radius:11px;padding:10px;font-weight:700;cursor:pointer}

.training-page{padding:28px;max-width:1500px;margin:auto}
.training-hero{background:linear-gradient(135deg,#003c41,#0b6b61);border-radius:24px;padding:28px;color:#fff;display:flex;justify-content:space-between;gap:24px;align-items:flex-end;box-shadow:0 18px 45px rgba(0,60,65,.18)}
.training-hero h1{margin:0 0 8px;font-size:30px}.training-hero p{margin:0;color:rgba(255,255,255,.78);max-width:720px}
.training-actions{display:flex;gap:10px;flex-wrap:wrap}.t-btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}.t-btn.primary{background:#fff;color:#003c41}.t-btn.green{background:#7dd3a7;color:#003c41}.t-btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.training-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}
.t-kpi{background:var(--surface,#fff);border:1px solid var(--border,#e6eceb);border-radius:18px;padding:18px}.t-kpi .n{font-size:28px;font-weight:800;color:var(--text,#17363a)}.t-kpi .l{font-size:12px;color:var(--muted,#6b7c7f);margin-top:4px}
.training-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:16px 0;flex-wrap:wrap}.training-tabs{display:flex;gap:6px;overflow:auto}.t-tab{border:0;background:transparent;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--muted,#6b7c7f)}.t-tab.active{background:#e8f3f0;color:#006257}
.training-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.training-card{background:var(--surface,#fff);border:1px solid var(--border,#e6eceb);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.04);transition:.2s}.training-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.08)}
.training-thumb{height:150px;background:linear-gradient(135deg,#e9f4f0,#d7e9e4);display:flex;align-items:center;justify-content:center;color:#006257;position:relative}.training-thumb .play{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.training-body{padding:16px}.training-body h3{margin:0 0 7px;color:var(--text,#17363a)}.training-body p{font-size:13px;color:var(--muted,#6b7c7f);min-height:38px}.training-meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.training-tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef4f2;color:#42615e}.training-progress{height:7px;background:#e8eeee;border-radius:99px;overflow:hidden}.training-progress i{display:block;height:100%;background:#1b9b7c;border-radius:99px}.training-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--muted,#6b7c7f)}
.training-modal{position:fixed;inset:0;background:rgba(5,25,28,.62);display:grid;place-items:center;padding:20px;z-index:9999}.training-dialog{width:min(920px,100%);max-height:92vh;overflow:auto;background:var(--surface,#fff);color:var(--text,#17363a);border-radius:22px;padding:22px}.training-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.training-form-grid .full{grid-column:1/-1}.training-form-grid input,.training-form-grid textarea,.training-form-grid select{width:100%;padding:11px;border:1px solid var(--border,#dbe4e2);border-radius:10px;background:var(--input,#fff);color:var(--text,#17363a)}.training-label{font-size:12px;font-weight:800;margin-bottom:6px;display:block}.training-close{float:right;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted,#6b7c7f)}
.video-wrap{background:#081719;border-radius:16px;overflow:hidden}.video-wrap video,.video-wrap iframe{width:100%;height:430px;border:0;display:block}.training-check{display:flex;align-items:center;gap:8px;margin-top:12px}.training-empty{padding:50px;text-align:center;border:1px dashed var(--border,#dbe4e2);border-radius:18px;color:var(--muted,#6b7c7f)}
.dark .training-card,.dark .t-kpi,.dark .training-dialog{background:#102124;color:#e8f1ef;border-color:#263b3d}.dark .training-body h3,.dark .t-kpi .n{color:#eef7f5}.dark .training-thumb{background:#183235}.dark .training-tag{background:#1a3235;color:#b9cfca}.dark .training-progress{background:#20383a}.dark .training-form-grid input,.dark .training-form-grid textarea,.dark .training-form-grid select{background:#0c1b1d;color:#e8f1ef;border-color:#2b4547}
@media(max-width:1050px){.training-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.training-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.training-page{padding:16px}.training-hero{display:block}.training-actions{margin-top:18px}.training-grid{grid-template-columns:1fr}.training-form-grid{grid-template-columns:1fr}.training-form-grid .full{grid-column:auto}.video-wrap video,.video-wrap iframe{height:240px}}

let SIDEBAR_EXPANDED = {};

function buildNavTree(user) {
  const perms = getPerms(user);
  const admin = isAdminUser(user);
  const almox = perms.almoxarifado || {};
  const tree = [{ id: "home", label: "Início", icon: "home", leaf: true }];

  const sciChildren = [];
  if (admin || almox.acesso) sciChildren.push({ id: "almoxarifado", label: "Nova Solicitação", icon: "clipboard", leaf: true });
  if (admin || almox.solicitacoes) sciChildren.push({ id: "almox_solicitacoes", label: "Solicitações", icon: "clipboard", leaf: true });
  if (admin || almox.familias) sciChildren.push({ id: "familias", label: "Família de Itens", icon: "clipboard", leaf: true });

  const scmChildren = [];
  if (admin || almox.scm_acesso) {
    scmChildren.push({ id: "almox_scm_form", label: "Nova Compra", icon: "cart", leaf: true });
    scmChildren.push({ id: "almox_scm_minhas", label: "Minhas SCM", icon: "cart", leaf: true });
  }
  if (admin || almox.scm_gestao) scmChildren.push({ id: "almox_scm_gestao", label: "Gestão de SCM", icon: "cart", leaf: true });
  if (admin || almox.scm_aprovacao) scmChildren.push({ id: "almox_scm_aprovacao", label: "Aprovações SCM", icon: "cart", leaf: true });

  const almoxChildren = [];
  if (sciChildren.length) almoxChildren.push({ id: "grp_sci", label: "SCI", icon: "clipboard", children: sciChildren });
  if (scmChildren.length) almoxChildren.push({ id: "grp_scm", label: "SCM", icon: "cart", children: scmChildren });

  if (almoxChildren.length) tree.push({ id: "grp_almoxarifado", label: "Almoxarifado", icon: "package", children: almoxChildren });

  if (admin || (perms.pcm && perms.pcm.acesso)) tree.push({ id: "pcm", label: "PCM", icon: "clipboard", leaf: true });
  if (admin || (perms.utilidades && perms.utilidades.acesso)) tree.push({ id: "utilidades", label: "Utilidades", icon: "zap", leaf: true });
  if (perms.training || admin) tree.push({ id: "treinamentos", label: "Treinamentos", icon: "bookopen", leaf: true });
  if (admin) tree.push({ id: "admin", label: "Administração", icon: "users", leaf: true });

  return tree;
}

function collectAncestors(nodes, activeId, ancestors) {
  for (let i = 0; i < nodes.length; i++) {
    const node = nodes[i];
    if (node.leaf) {
      if (node.id === activeId) return true;
    } else if (node.children) {
      if (collectAncestors(node.children, activeId, ancestors)) {
        ancestors.push(node.id);
        return true;
      }
    }
  }
  return false;
}

function renderNavNodes(nodes, level) {
  return nodes.map(function (node) {
    const sizePx = level > 0 ? 16 : 18;
    if (node.leaf) {
      return `<button class="nav-item nav-item-lvl${level}" data-nav="${node.id}">${icon(node.icon, sizePx)}<span>${esc(node.label)}</span></button>`;
    }
    const expanded = !!SIDEBAR_EXPANDED[node.id];
    const childrenHtml = expanded ? '<div class="nav-children">' + renderNavNodes(node.children, level + 1) + '</div>' : '';
    return `<button class="nav-item nav-group nav-item-lvl${level}" data-group="${node.id}">${icon(node.icon, sizePx)}<span>${esc(node.label)}</span><span class="nav-chevron${expanded ? " expanded" : ""}">${icon("chevrondown", 14)}</span></button>${childrenHtml}`;
  }).join("");
}

function renderSidebarNav() {
  const tree = buildNavTree(STATE.currentUser);
  const ancestors = [];
  collectAncestors(tree, STATE.activeArea, ancestors);
  ancestors.forEach(function (id) { SIDEBAR_EXPANDED[id] = true; });
  return renderNavNodes(tree, 0);
}

function attachShellEvents() {
  document.getElementById("mobile-menu-btn").onclick = function () {
    document.getElementById("sidebar").classList.toggle("open");
    const backdrop = document.getElementById("sidebar-backdrop");
    backdrop.style.display = backdrop.style.display === "none" ? "block" : "none";
  };
  document.getElementById("sidebar-backdrop").onclick = function () {
    document.getElementById("sidebar").classList.remove("open");
    this.style.display = "none";
  };
  document.getElementById("logout-btn").onclick = function () {
    STATE.currentUser = null;
    STATE.screen = "login";
    render();
  };
  attachSidebarNavEvents();
}

function attachSidebarNavEvents() {
  const nav = document.getElementById("sidebar-nav");
  nav.onclick = function (e) {
    const groupBtn = e.target.closest("[data-group]");
    if (groupBtn) {
      const gid = groupBtn.getAttribute("data-group");
      SIDEBAR_EXPANDED[gid] = !SIDEBAR_EXPANDED[gid];
      nav.innerHTML = renderSidebarNav();
      updateActiveNav();
      return;
    }
    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) {
      navigateTo(navBtn.getAttribute("data-nav"));
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebar-backdrop").style.display = "none";
    }
  };
}

function updateActiveNav() {
  document.querySelectorAll("[data-nav]").forEach(function (btn) {
    btn.classList.toggle("active", btn.getAttribute("data-nav") === STATE.activeArea);
  });
}

function navigateTo(areaId) {
  STATE.activeArea = areaId;
  const el = document.getElementById("main-content");
  const perms = getPerms(STATE.currentUser);
  const admin = isAdminUser(STATE.currentUser);
  const almox = perms.almoxarifado || {};

  if (areaId === "home") el.innerHTML = renderHome();
  else if (areaId === "almoxarifado") { el.innerHTML = renderAlmoxarifado("form"); attachAlmoxarifadoEvents(); }
  else if (areaId === "almox_solicitacoes" && (admin || almox.solicitacoes)) {
    el.innerHTML = renderAlmoxarifado("list"); attachAlmoxarifadoEvents();
  }
  else if (areaId === "almox_scm_form" && (admin || almox.scm_acesso)) {
    el.innerHTML = renderAlmoxarifado("scm_form"); attachAlmoxarifadoEvents();
  }
  else if (areaId === "almox_scm_minhas" && (admin || almox.scm_acesso)) {
    el.innerHTML = renderAlmoxarifado("scm_minhas"); attachAlmoxarifadoEvents();
  }
  else if (areaId === "almox_scm_gestao" && (admin || almox.scm_gestao)) {
    el.innerHTML = renderAlmoxarifado("scm_gestao"); attachAlmoxarifadoEvents();
  }
  else if (areaId === "almox_scm_aprovacao" && (admin || almox.scm_aprovacao)) {
    el.innerHTML = renderAlmoxarifado("scm_aprovacao"); attachAlmoxarifadoEvents();
  }
  else if (areaId === "familias" && (admin || almox.familias)) {
    el.innerHTML = renderFamiliasPage(); attachFamiliasPageEvents();
  }
  else if (areaId === "pcm") el.innerHTML = renderPlaceholder("PCM", "clipboard", "Planejamento e Controle de Manutenção: ordens de serviço, planos preventivos e indicadores.");
  else if (areaId === "utilidades") { el.innerHTML = renderUtilitiesPage(STATE.currentUser); attachUtilitiesEvents(); }
  else if (areaId === "treinamentos" && (perms.training || admin)) { el.innerHTML = renderTrainingArea(STATE.currentUser, admin); attachTrainingAreaEvents(STATE.currentUser, admin); }
  else if (areaId === "admin" && admin) { el.innerHTML = renderAdmin(); attachAdminEvents(); }

  updateActiveNav();
  if (areaId === "home") attachHomeEvents();
}

function slugifyField(str) {
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "") || ("campo_" + Date.now());
}

}

      return;

    const rows = document.querySelectorAll("#fam-fields-list .fam-field-row");
    const campos = [];

    rows.forEach(function (row) {
      const label = row.querySelector(".fam-field-label").value.trim();
      if (!label) return;
      const obrigatorio = row.querySelector(".fam-field-req input").checked;
      let id = slugifyField(label);
      let uniqueId = id, n = 2;
      while (usedIds[uniqueId]) { uniqueId = id + "_" + n; n++; }
      usedIds[uniqueId] = true;
      campos.push({ id: uniqueId, label: label, obrigatorio: obrigatorio });
    });

    if (isNew) {
      const famId2 = slugifyField(nome) + "_" + Date.now();
      FAMILIES.push({ id: famId2, nome: nome, campos: campos });
    } else {
      const idx = FAMILIES.findIndex(function (f) { return f.id === famId; });
      FAMILIES[idx] = Object.assign({}, FAMILIES[idx], { nome: nome, campos: campos });
    }
    saveFamilies(FAMILIES);
    closeFamiliasModal();
    refreshFamiliasPage();
  };
}

let ALMOX_STATE = { tab: "form" };
let SCI_FOTO_DATAURL = null;

function getAlmoxTabs() {
  const user = STATE.currentUser;
  const admin = isAdminUser(user);
  const perms = getPerms(user).almoxarifado || {};
  const tabs = [];
  if (admin || perms.acesso) tabs.push({ id: "form", label: "Nova Solicitação (SCI)" });
  if (admin || perms.solicitacoes) tabs.push({ id: "list", label: "Solicitações (SCI)" });

    tabs.push({ id: "scm_form", label: "Nova Compra (SCM)" });

  }
  if (admin || perms.scm_gestao) tabs.push({ id: "scm_gestao", label: "Gestão de SCM" });
  if (admin || perms.scm_aprovacao) tabs.push({ id: "scm_aprovacao", label: "Aprovações SCM" });

}

  const tabs = getAlmoxTabs();

// ---- Exportação para Excel (CSV) ----
function csvEscape(val) {
  const str = (val === undefined || val === null) ? "" : String(val);
  if (/[;"\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
  return str;
}

// Exporta uma tabela (múltiplos itens), com colunas dinâmicas restritas às famílias presentes na seleção
function exportSciToExcel(idsToExport) {
  const items = SCI_LIST.filter(function (s) { return idsToExport.includes(s.id); });
  if (items.length === 0) return;

  // Uma única solicitação selecionada -> exporta como ficha (Campo / Valor), mais legível
  if (items.length === 1) {
    exportSingleSciAsFicha(items[0]);
    return;
  }

  // Várias solicitações -> monta colunas dinâmicas SOMENTE das famílias presentes na seleção
  const familiaIds = {};
  items.forEach(function (s) { familiaIds[s.familiaId] = true; });
  const dynColumns = [];
  const seenLabels = {};
  FAMILIES.filter(function (fam) { return familiaIds[fam.id]; }).forEach(function (fam) {
    fam.campos.forEach(function (c) {
      const key = c.label.trim().toUpperCase();
      if (!seenLabels[key]) { seenLabels[key] = true; dynColumns.push(c.label); }
    });
  });

  const fixedColumns = ["Código", "Família", "Status", "Solicitante", "Data", "Nº Processo ME", "Observação Almoxarife", "Link", "Marcas Homologadas", "Observações Gerais"];
  const header = fixedColumns.concat(dynColumns);
  const lines = [header.map(csvEscape).join(";")];

  items.forEach(function (s) {
    const row = [
      s.codigo || "",
      s.familiaNome || "",
      statusDef(s.status).label,
      s.solicitanteNome || "",
      formatDate(s.dataCriacao),
      s.numeroProcessoME || "",
      s.observacaoAlmoxarife || "",
      s.link || "",
      s.marcas || "",
      s.observacoes || "",
    ];
    dynColumns.forEach(function (colLabel) {
      const fieldDef = s.camposDefs.find(function (c) { return c.label.trim().toUpperCase() === colLabel.trim().toUpperCase(); });
      row.push(fieldDef ? (s.campos[fieldDef.id] || "") : "");
    });
    lines.push(row.map(csvEscape).join(";"));
  });

  downloadCsv(lines.join("\r\n"), "solicitacoes_sci_" + new Date().toISOString().slice(0, 10) + ".csv");
}

// Exporta uma única solicitação em formato de ficha vertical (Campo / Valor) — mais legível para 1 item
function exportSingleSciAsFicha(s) {
  const lines = [["Campo", "Valor"].map(csvEscape).join(";")];
  function addRow(campo, valor) { lines.push([campo, valor || ""].map(csvEscape).join(";")); }

  addRow("Código", s.codigo);
  addRow("Família", s.familiaNome);
  addRow("Status", statusDef(s.status).label);
  addRow("Solicitante", s.solicitanteNome);
  addRow("Data", formatDate(s.dataCriacao));
  addRow("Nº Processo ME", s.numeroProcessoME);
  addRow("Observação Almoxarife", s.observacaoAlmoxarife);
  s.camposDefs.forEach(function (c) { addRow(c.label, s.campos[c.id]); });
  addRow("Link", s.link);
  addRow("Marcas Homologadas", s.marcas);
  addRow("Observações Gerais", s.observacoes);

  downloadCsv(lines.join("\r\n"), (s.codigo || "sci") + ".csv");
}

function downloadCsv(csvBody, filename) {
  const csvContent = "\uFEFF" + csvBody;
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function closeSciModal() {

function setSciStatus(sciId, status, numeroProcessoME, observacaoAlmoxarife) {

function attachScmFormEvents() {
  SCM_ANEXOS_DATA = [];
  document.getElementById("scm-tipo-fornecedor").onchange = function () {
    document.getElementById("scm-fornecedor-block").style.display = (this.value === "escolhido" || this.value === "exclusivo") ? "block" : "none";
  };
  document.getElementById("scm-tipo-solicitacao").onchange = function () {
    document.getElementById("scm-capex-block").style.display = (this.value === "melhoria_capex") ? "block" : "none";
  };
  document.getElementById("scm-centro-custo").onchange = function () {
    document.getElementById("scm-centro-custo-outro-block").style.display = (this.value === "Outro") ? "block" : "none";
  };
  document.getElementById("scm-anexos").onchange = function (e) {
    const files = Array.from(e.target.files || []);
    const nomesEl = document.getElementById("scm-anexos-nomes");
    const previewEl = document.getElementById("scm-anexos-preview");
    nomesEl.textContent = files.map(function (f) { return f.name; }).join(", ");
    previewEl.innerHTML = "";
    SCM_ANEXOS_DATA = [];
    files.forEach(function (file) {
      const reader = new FileReader();
      reader.onload = function (evt) {
        SCM_ANEXOS_DATA.push({ name: file.name, dataUrl: evt.target.result });
        if (file.type.indexOf("image/") === 0) {
          const img = document.createElement("img");
          img.src = evt.target.result;
          img.style.cssText = "width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #e7f0ec;";
          previewEl.appendChild(img);
        } else {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = file.name;
          previewEl.appendChild(tag);
        }
      };
      reader.readAsDataURL(file);
    });
  };
  document.getElementById("scm-add-item-btn").onclick = function () {
    const wrap = document.createElement("div");
    wrap.innerHTML = scmItemRowHtml();
    document.getElementById("scm-items-list").appendChild(wrap.firstElementChild);
    bindScmRemoveButtons();
  };
  bindScmRemoveButtons();

  document.getElementById("scm-submit-btn").onclick = function () {
    const errBox = document.getElementById("scm-form-error");
    const time = document.getElementById("scm-time").value;
    const tipoSolicitacao = document.getElementById("scm-tipo-solicitacao").value;
    const camm = document.getElementById("scm-camm").value;
    const urgencia = document.getElementById("scm-urgencia").value;
    const centroCustoSel = document.getElementById("scm-centro-custo").value;
    const centroCusto = centroCustoSel === "Outro" ? document.getElementById("scm-centro-custo-outro").value.trim() : centroCustoSel;
    const numeroOM = document.getElementById("scm-om").value.trim();
    const tipoFornecedor = document.getElementById("scm-tipo-fornecedor").value;
    const nomeFornecedor = document.getElementById("scm-nome-fornecedor") ? document.getElementById("scm-nome-fornecedor").value.trim() : "";
    const tipoPedido = document.getElementById("scm-tipo-pedido").value;
    const descricaoUso = document.getElementById("scm-descricao-uso").value.trim();
    const capexProjeto = document.getElementById("scm-capex") ? document.getElementById("scm-capex").value.trim() : "";
    const links = document.getElementById("scm-links").value.trim();

    const missing = [];
    if (!time) missing.push("Time Solicitante");
    if (!camm) missing.push("CAMM");
    if (!urgencia) missing.push("Urgência");
    if (!centroCusto) missing.push("Centro de Custo");
    if (!numeroOM) missing.push("Nº OM");
    if (!tipoPedido) missing.push("Tipo de Pedido");
    if (!descricaoUso) missing.push("Descrição de uso do material");

    const itemCards = document.querySelectorAll(".scm-item-card");
    const itens = [];
    let itemError = false;
    itemCards.forEach(function (card, idx) {
      const codigoSistema = card.querySelector(".scm-f-codigo").value.trim();
      const descricaoItem = card.querySelector(".scm-f-descricao").value.trim();
      const quantidade = card.querySelector(".scm-f-quantidade").value.trim();
      const estoqueMinimo = card.querySelector(".scm-f-estoque").value.trim();
      const marcaModeloSerie = card.querySelector(".scm-f-marca").value.trim();
      if (!codigoSistema || !quantidade) itemError = true;
      itens.push({ id: "item-" + idx, codigoSistema, descricaoItem, quantidade, estoqueMinimo, marcaModeloSerie });
    });

    if (missing.length) {
      errBox.innerHTML = '<div class="login-error" style="margin-top:12px;">Preencha os campos obrigatórios: ' + esc(missing.join(", ")) + '</div>';
      return;
    }
    if (itemError) {
      errBox.innerHTML = '<div class="login-error" style="margin-top:12px;">Preencha ao menos Código Sistema e Quantidade em cada item.</div>';
      return;
    }

    const novoCodigo = nextScmCode();
    const user = STATE.currentUser;
    const novaScm = {
      id: "scm-" + Date.now(),
      codigo: novoCodigo,
      timeSolicitante: time,
      tipoSolicitacao: tipoSolicitacao,
      capexProjeto: capexProjeto,
      camm: camm,
      urgencia: urgencia,
      centroCusto: centroCusto,
      numeroOM: numeroOM,
      tipoFornecedor: tipoFornecedor,
      nomeFornecedor: nomeFornecedor,
      tipoPedido: tipoPedido,
      descricaoUso: descricaoUso,
      itens: itens,
      anexos: SCM_ANEXOS_DATA.slice(),
      links: links,
      solicitanteId: user.id,
      solicitanteNome: user.nome,
      solicitanteEmail: user.usuario,
      solicitanteEmailLider: (user.emailLider || "").trim(),
      solicitanteTime: user.time || "",
      dataCriacao: new Date().toISOString(),
      status: "pendente_aprovacao_lider",
      observacaoLider: "",
      observacaoAlmoxarife: "",
      numeroProcessoME: "",
    };
    SCM_LIST.unshift(novaScm);
    saveScm(SCM_LIST);

    const liderMsg = novaScm.solicitanteEmailLider
      ? 'Um e-mail seria enviado para <b>' + esc(novaScm.solicitanteEmailLider) + '</b> avisando sobre a nova solicitação de compra.'
      : 'Este usuário não tem e-mail de líder cadastrado — peça ao Admin para completar o cadastro dele.';

    const el = document.getElementById("almox-tab-content");
    el.innerHTML = '<div class="hint-box" style="background:#e3eff0; color:#003C41; margin-bottom:16px;"><b>Solicitação de compra enviada!</b> Código gerado: <b>' + esc(novoCodigo) + '</b>. ' + liderMsg + '</div>' + renderScmForm();
    attachScmFormEvents();
  };
}

function scmLabel(field, value) {

// ---- Exportação SCM para Excel ----
function exportScmToExcel(idsToExport) {
  const items = SCM_LIST.filter(function (s) { return idsToExport.includes(s.id); });
  if (items.length === 0) return;

  if (items.length === 1) {
    exportSingleScmAsFicha(items[0]);
    return;
  }

  const header = [
    "Código", "Status", "Solicitante", "E-mail Solicitante", "E-mail Líder", "Time Solicitante", "Data",
    "Tipo de Solicitação", "Nº CAPEX/Projeto", "CAMM", "Urgência", "Centro de Custo", "Nº OM",
    "Tipo de Fornecedor", "Nome Fornecedor", "Tipo de Pedido", "Descrição de Uso",
    "Qtd. Itens", "Itens (resumo)", "Links", "Observação Líder", "Observação Almoxarife", "Nº Processo ME",
  ];
  const lines = [header.map(csvEscape).join(";")];

  items.forEach(function (s) {
    const itensResumo = (s.itens || []).map(function (it) {
      return (it.codigoSistema || "") + " - " + (it.descricaoItem || "") + " (Qtd " + (it.quantidade || "") + ")";
    }).join(" | ");
    const row = [
      s.codigo, scmStatusDef(s.status).label, s.solicitanteNome, s.solicitanteEmail, s.solicitanteEmailLider, s.timeSolicitante,
      formatDate(s.dataCriacao), scmLabel("tipoSolicitacao", s.tipoSolicitacao), s.capexProjeto, s.camm, s.urgencia,
      s.centroCusto, s.numeroOM, scmLabel("tipoFornecedor", s.tipoFornecedor), s.nomeFornecedor,
      scmLabel("tipoPedido", s.tipoPedido), s.descricaoUso, (s.itens || []).length, itensResumo, s.links,
      s.observacaoLider, s.observacaoAlmoxarife, s.numeroProcessoME,
    ];
    lines.push(row.map(csvEscape).join(";"));
  });

  downloadCsv(lines.join("\r\n"), "solicitacoes_scm_" + new Date().toISOString().slice(0, 10) + ".csv");
}

function exportSingleScmAsFicha(s) {
  const lines = [["Campo", "Valor"].map(csvEscape).join(";")];
  function addRow(campo, valor) { lines.push([campo, valor || ""].map(csvEscape).join(";")); }

  addRow("Código", s.codigo);
  addRow("Status", scmStatusDef(s.status).label);
  addRow("Solicitante", s.solicitanteNome);
  addRow("E-mail Solicitante", s.solicitanteEmail);
  addRow("E-mail Líder", s.solicitanteEmailLider);
  addRow("Time Solicitante", s.timeSolicitante);
  addRow("Data", formatDate(s.dataCriacao));
  addRow("Tipo de Solicitação", scmLabel("tipoSolicitacao", s.tipoSolicitacao));
  addRow("Nº CAPEX/Projeto", s.capexProjeto);
  addRow("CAMM", s.camm);
  addRow("Urgência", s.urgencia);
  addRow("Centro de Custo", s.centroCusto);
  addRow("Nº OM", s.numeroOM);
  addRow("Tipo de Fornecedor", scmLabel("tipoFornecedor", s.tipoFornecedor));
  addRow("Nome Fornecedor", s.nomeFornecedor);
  addRow("Tipo de Pedido", scmLabel("tipoPedido", s.tipoPedido));
  addRow("Descrição de Uso", s.descricaoUso);
  (s.itens || []).forEach(function (it, idx) {
    addRow("Item " + (idx + 1) + " - Código Sistema", it.codigoSistema);
    addRow("Item " + (idx + 1) + " - Descrição", it.descricaoItem);
    addRow("Item " + (idx + 1) + " - Quantidade", it.quantidade);
    addRow("Item " + (idx + 1) + " - Estoque Mínimo", it.estoqueMinimo);
    addRow("Item " + (idx + 1) + " - Marca/Modelo/Série", it.marcaModeloSerie);
  });
  addRow("Links", s.links);
  addRow("Observação Líder", s.observacaoLider);
  addRow("Observação Almoxarife", s.observacaoAlmoxarife);
  addRow("Nº Processo ME", s.numeroProcessoME);

  downloadCsv(lines.join("\r\n"), (s.codigo || "scm") + ".csv");
}

function finalizeScmDecision(scmId, novoStatus, observacao, avisarTecnico) {
  const idx = SCM_LIST.findIndex(function (x) { return x.id === scmId; });
  SCM_LIST[idx].status = novoStatus;
  SCM_LIST[idx].observacaoLider = observacao;
  saveScm(SCM_LIST);

  const modalRoot = document.getElementById("almox-modal-root");
  const emailMsg = avisarTecnico
    ? '<br>Um e-mail seria enviado para <b>' + esc(SCM_LIST[idx].solicitanteEmail) + '</b> avisando que a solicitação precisa de revisão.'
    : "";
  modalRoot.innerHTML = '<div class="hint-box" style="background:#e3eff0; color:#003C41;"><b>Decisão registrada!</b> Status atualizado para "' + esc(scmStatusDef(novoStatus).label) + '".' + emailMsg + '</div>';
  setTimeout(function () {
    modalRoot.innerHTML = "";
    renderAlmoxTabContent();
  }, 2200);
}

async function hydrateBiosegSide(user,admin){const list=getTrainings().filter(t=>t.active!==false),uid=user.email||user.usuario;const active=list.filter(t=>{const p=trainingProgressFor(t.id,uid);return p>0&&p<100}).sort((a,b)=>trainingProgressFor(b.id,uid)-trainingProgressFor(a.id,uid)).slice(0,4);const target=document.getElementById('bio-continue-list');if(target)target.innerHTML=active.length?active.map(t=>{const p=trainingProgressFor(t.id,uid);return `<button data-training-open="${esc(t.id)}" style="border:0;background:none;text-align:left;display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:10px 0;width:100%"><span class="bioseg-side-icon">${icon('play',14)}</span><span><strong>${esc(t.title)}</strong><span>${p}% concluído</span></span><b>${p}%</b></button>`}).join(''):'<div class="bioseg-empty">Você não tem treinamentos em andamento.</div>';if(target)target.querySelectorAll('[data-training-open]').forEach(b=>b.onclick=()=>{const t=list.find(x=>x.id===b.dataset.trainingOpen);if(t)openTrainingViewer(t,user)});
 const prog=list.map(t=>trainingProgressFor(t.id,uid));const ip=prog.filter(p=>p>0&&p<100).length,ns=prog.filter(p=>p===0).length;{const a=document.getElementById('bio-in-progress');const b=document.getElementById('bio-not-started');if(a)a.textContent=ip;if(b)b.textContent=ns;}
 if(admin){const users=(await SB.from('profiles').select('id,name,email').eq('active',true)).data||[];let completion=0,progressing=0,total=users.length*list.length;const rows=[];users.forEach(u=>list.forEach(t=>{const p=trainingProgressFor(t.id,u.email||u.id);if(p>=100)completion++;else if(p>0)progressing++;rows.push({user:u.name||u.email,course:t.title,p,status:p>=100?'Concluído':p>0?'Em andamento':'Não iniciado'})}));document.getElementById('bio-admin-users')&&(document.getElementById('bio-admin-users').textContent=users.length);document.getElementById('bio-admin-completions')&&(document.getElementById('bio-admin-completions').textContent=completion);document.getElementById('bio-admin-progressing')&&(document.getElementById('bio-admin-progressing').textContent=progressing);document.getElementById('bio-admin-rate')&&(document.getElementById('bio-admin-rate').textContent=total?Math.round(completion/total*100)+'%':'0%');const tab=document.getElementById('bio-admin-table');if(tab)tab.innerHTML=rows.length?`<table><thead><tr><th>Colaborador</th><th>Treinamento</th><th>Progresso</th><th>Status</th></tr></thead><tbody>${rows.slice(0,120).map(r=>`<tr><td>${esc(r.user)}</td><td>${esc(r.course)}</td><td>${r.p}%</td><td>${r.status}</td></tr>`).join('')}</tbody></table>`:'<div class="bioseg-empty">Sem dados de treinamento.</div>'}
}
function openBiosegSettings(){openV12Settings()}
})();
