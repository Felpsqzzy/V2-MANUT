const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],K=(l,v,h,c='')=>`<div class="metric"><small>${l}</small><strong class="${c}">${v}</strong><em>${h}</em></div>`;

function inicio(){return `<div class="page"><section class="hero"><div class="box"><div class="ey">Plataforma interna · manutenção industrial</div><h2>O que precisa ser resolvido hoje?</h2><p>Técnico, almoxarifado, PCM, liderança e gestão em uma única experiência. A interface muda por perfil e o dado segue centralizado.</p><div class="actions"><button class="btn primary" data-rg="ordens">Apontar hora</button><button class="btn alt" data-rg="materiais">Pedir material</button><button class="btn" data-rg="solicitacoes">Abrir SCI / SCM</button><button class="btn" data-rg="treinamentos">Treinamentos</button></div></div><div class="box hero-side"><h3>Prioridades do turno</h3>${[['2','Horas aguardando','aprovação'],['4','Solicitações','em andamento'],['2','Treinamentos','próximos do prazo'],['1','OS crítica','sem movimentação']].map(x=>`<div class="side-row"><span>${x[1]}</span><b>${x[0]} · ${x[2]}</b></div>`).join('')}</div></section><section class="metrics">${K('Solicitações abertas','04','2 altas')}${K('OS em execução','06','1 crítica')}${K('Horas do período','126h','+8% mês')}${K('Materiais pendentes','09','3 urgentes','warn')}${K('Treinamentos','92%','conformidade','ok')}</section><section class="grid2">${card('Fila que exige decisão','Registros com próximo passo definido.',`<div class="list">${req.map(r=>`<div class="row"><div><b>${r[0]} · ${r[1]}</b><span>${r[2]}</span></div><em class="tag ${r[4]}">${r[3]}</em></div>`).join('')}</div>`)}${card('Horas por equipe','Período atual · operação.',`<div class="bars">${[['Mecânica',82],['Elétrica',64],['Automação',55],['Utilidades',41],['Predial',28]].map(x=>`<div class="bar"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><b>${x[1]}h</b></div>`).join('')}</div>`)}</section></div>`}
function tablePage(title,sub,button,rows){return `<div class="page"><div class="section"><div><h2>${title}</h2><p>${sub}</p></div><button class="btn primary" data-modal="${button}">+ Nova ação</button></div><section class="box"><div class="chips"><button class="chip on">Todas</button><button class="chip">Urgentes</button><button class="chip">Em andamento</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Identificador</th><th>Descrição</th><th>Responsável</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${r[4]||'ok'}">${r[3]}</span></td></tr>`).join('')}</tbody></table></div></section></div>`}
function renderPage(r){if(r==='inicio')return inicio();if(r==='solicitacoes')return tablePage('Solicitações SCI e SCM','Cadastro de item e compra de material em fluxos distintos.','request',req);if(r==='ordens')return tablePage('Ordens e apontamento de horas','Tempo ligado a uma única origem, com integridade no servidor.','time',[['OS-2026-00418','Vazamento em linha de água industrial','Mecânica','Em execução','info'],['OS-2026-00417','Troca de sensor de temperatura','Automação','Aberta','warn'],['OS-2026-00413','Inspeção de válvula de gás','Utilidades','Concluída','ok']]);if(r==='materiais')return `<div class="page"><div class="section"><div><h2>Materiais</h2><p>Solicitação e consumo. Saldo e inventário permanecem no ERP.</p></div><button class="btn primary" data-modal="material">+ Pedir material</button></div><div class="grid3"><div class="box"><h3>Fila do almoxarifado</h3><strong class="big">09</strong><p class="muted">solicitações · 3 urgentes</p></div><div class="box"><h3>Atendimento parcial</h3><p class="muted">Pedido, aprovado e entregue por item.</p></div><div class="box"><h3>Catálogo</h3><p class="muted">Famílias e especificações dinâmicas.</p></div></div></div>`;if(r==='treinamentos')return `<div class="page"><div class="section"><div><h2>Treinamentos</h2><p>Trilhas, versões, quiz, conclusão e validade.</p></div><button class="btn primary">Gerenciar conteúdo</button></div><section class="metrics">${K('Obrigatórios','05','3 concluídos')}${K('Em andamento','02','1 com prazo')}${K('Atrasados','01','ação necessária','warn')}${K('Conformidade','92%','meta 95%','ok')}${K('Próximo vencimento','12d','NR-10','warn')}</section><div class="grid3">${[['NR-10 · Segurança elétrica',74,'warn'],['LOTO · Bloqueio e etiquetagem',48,'info'],['Troca de válvula',100,'ok']].map(t=>card(t[0],'Obrigatório · progresso',`<div class="track"><div class="fill" style="width:${t[1]}%"></div></div><p class="muted">${t[1]}% concluído</p><button class="btn ${t[1]===100?'':'primary'}">${t[1]===100?'Ver comprovante':'Continuar'}</button>`)).join('')}</div></div>`;if(r==='utilidades')return `<div class="page"><div class="section"><div><h2>Utilidades</h2><p>Água, gás e energia com evidência fotográfica.</p></div><button class="btn primary" data-modal="meter">Registrar leitura</button></div><section class="metrics">${K('Medidores','18','4 unidades')}${K('Leituras hoje','12','última 08:42')}${K('Pendências','02','evidência','warn')}${K('Água','18,4 m³','período')}${K('Gás','2.940 m³','período')}</section><div class="grid3">${[['CAMM 1 · Água','UG-001','1.248,5 m³'],['CAMM 2 · Gás','GM-004','2.940,2 m³'],['C. LOG · Energia','EL-006','481.208 kWh']].map(x=>card(x[0],x[1],`<strong class="big">${x[2]}</strong><p class="muted">Última leitura atualizada</p><button class="btn primary" data-modal="meter">Registrar leitura</button>`)).join('')}</div></div>`;if(r==='painel')return `<div class="page"><div class="section"><div><h2>Painel gerencial e operacional</h2><p>Indicadores por período, equipe e status.</p></div><div class="chips"><button class="chip on">30 dias</button><button class="chip">Equipe</button><button class="chip">Status</button></div></div><section class="metrics">${K('Disponibilidade','96,2%','meta PCM','ok')}${K('Ordens concluídas','84','+11%')}${K('SLA','91%','+4%','ok')}${K('Consumo','ERP','sem saldo')}${K('Treinamentos','92%','+3%','ok')}</section><section class="grid2">${card('Ordens por equipe','Quantidade concluída.',`<div class="bars">${[['Mecânica',78],['Elétrica',62],['Automação',55],['Utilidades',44],['Predial',31]].map(x=>`<div class="bar"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><b>${x[1]}</b></div>`).join('')}</div>`)}${card('Conformidade por trilha','Apenas escopo autorizado.',`<div class="bars">${[['Segurança',96],['Processos',91],['Equipamentos',89],['Procedimentos',94]].map(x=>`<div class="bar"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><b>${x[1]}%</b></div>`).join('')}</div>`)}</section></div>`;if(r==='admin')return `<div class="page"><div class="section"><div><h2>Administração</h2><p>RBAC, equipes, auditoria e configurações.</p></div></div><div class="grid3">${[['Usuários','43 ativos'],['Papéis','8 papéis'],['Equipes','12 nós'],['Auditoria','1.284 eventos'],['Notificações','07 pendentes'],['Configurações','OK']].map(x=>card(x[0],'Governança',`<strong class="big">${x[1]}</strong><button class="btn">Abrir módulo</button>`)).join('')}</div></div>`;return `<div class="page"><div class="plan"><aside class="toc"><div class="group">Diagnóstico</div>${P.slice(0,5).map(x=>`<a href="#p${x[0]}"><i>${x[0]}</i>${x[1]}</a>`).join('')}<div class="group">Solução</div>${P.slice(5,9).map(x=>`<a href="#p${x[0]}"><i>${x[0]}</i>${x[1]}</a>`).join('')}<div class="group">Execução</div>${P.slice(9).map(x=>`<a href="#p${x[0]}"><i>${x[0]}</i>${x[1]}</a>`).join('')}</aside><main class="planbody"><header class="planhead"><div class="ey">Biotrop · Manutenção industrial · Plano de arquitetura v1</div><h2>Plataforma de Manutenção Biotrop</h2><p>Planejamento integrado ao produto, com a linguagem visual do HTML de referência e a operação organizada por módulos.</p></header><div class="meta"><div><small>Data</small><b>03/09/2026</b></div><div><small>Solicitante</small><b>Felipe Vieira</b></div><div><small>Base</small><b>V2-MANUT</b></div><div><small>Status</small><b>Aguardando validação</b></div></div>${P.map(x=>`<section class="psec" id="p${x[0]}"><div class="pnum">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p>${x[0]==='01'?`<div class="cards">${[['Acesso e RBAC','Perfis, permissões e auditoria.'],['SCI / SCM','Cadastro de item e compra separados.'],['Horas / OS','Esforço ligado a uma origem.'],['Treinamentos','Conteúdo versionado.'],['Utilidades','Leituras com evidência.'],['Princípio','Menos remendos, mais estrutura.']].map(a=>`<div class="pc"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div>`:''}${x[0]==='04'?`
