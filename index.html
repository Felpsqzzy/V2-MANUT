<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#003c41">
<title>BIOTROP — Gestão Industrial</title>
<style>html,body{margin:0;width:100%;height:100%;background:#003c41;font-family:system-ui,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;color:#fff;font-weight:700}</style>
</head>
<body>
<div id="boot">Abrindo BIOTROP — Control Room…</div>
<script>
(async()=>{
  const go=()=>location.replace('./app.html?v='+Date.now());
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('biotrop-')).map(k=>caches.delete(k)));
      await navigator.serviceWorker.register('./sw.js?v=25',{scope:'./'});
    }
  }catch(e){console.warn('bootstrap:',e)}
  go();
})();
</script>
<noscript><div id="boot">Ative o JavaScript para abrir o sistema.</div></noscript>
</body>
</html>
